---
all:
  vars:
    ansible_user: ubuntu
    onprem_inventory_confirmed: false
  hosts:
    master1:
      ansible_host: 172.30.0.11
      ip: 172.30.0.11
      access_ip: 172.30.0.11
      physical_host: server
      planned_vcpu: 2
      planned_memory_mb: 4096
      planned_disk_gb: 40
      etcd_member_name: etcd-master1
      node_labels:
        platform-cluster: onprem-manager
        platform-role: control-plane
    master2:
      ansible_host: 172.30.0.12
      ip: 172.30.0.12
      access_ip: 172.30.0.12
      physical_host: laptop1
      planned_vcpu: 2
      planned_memory_mb: 4096
      planned_disk_gb: null
      etcd_member_name: etcd-master2
      node_labels:
        platform-cluster: onprem-manager
        platform-role: control-plane
    master3:
      ansible_host: 172.30.0.13
      ip: 172.30.0.13
      access_ip: 172.30.0.13
      physical_host: laptop2
      planned_vcpu: 2
      planned_memory_mb: 4096
      planned_disk_gb: null
      etcd_member_name: etcd-master3
      node_labels:
        platform-cluster: onprem-manager
        platform-role: control-plane
    worker1:
      ansible_host: 172.30.0.21
      ip: 172.30.0.21
      access_ip: 172.30.0.21
      physical_host: server
      planned_vcpu: 4
      planned_memory_mb: 12288
      planned_disk_gb: 80
