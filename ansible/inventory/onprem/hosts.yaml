        platform-cluster: onprem-manager
        platform-role: worker
        platform-worker: 'true'
    worker2:
      ansible_host: 172.30.0.22
      ip: 172.30.0.22
      access_ip: 172.30.0.22
      physical_host: laptop1
      planned_vcpu: 4
      planned_memory_mb: 12288
      planned_disk_gb: null
      node_labels:
        platform-cluster: onprem-manager
        platform-role: worker
        platform-worker: 'true'
    worker3:
      ansible_host: 172.30.0.23
      ip: 172.30.0.23
      access_ip: 172.30.0.23
      physical_host: laptop2
      planned_vcpu: 4
      planned_memory_mb: 12288
      planned_disk_gb: null
      node_labels:
        platform-cluster: onprem-manager
        platform-role: worker
        platform-worker: 'true'
  children:
    kube_control_plane:
      hosts:
        master1: {}
        master2: {}
        master3: {}
    etcd:
      hosts:
        master1: {}
        master2: {}
        master3: {}
    kube_node:
      hosts:
        worker1: {}
        worker2: {}
        worker3: {}
    k8s_cluster:
      children:
        kube_control_plane: {}
        kube_node: {}
