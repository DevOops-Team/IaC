---
# Kubernetes API HA ONLY. Example address, reserve/confirm before deployment.
kube_vip_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_arp_enabled: true
# Web traffic uses internal ClusterIP Service DNS, no service VIP advertisement.
kube_vip_services_enabled: false
kube_vip_address: 172.30.0.120
kube_vip_interface: ens18
loadbalancer_apiserver:
  address: "{{ kube_vip_address }}"
  port: 6443
supplementary_addresses_in_ssl_keys:
  - "{{ kube_vip_address }}"
