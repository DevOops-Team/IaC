---
# ADR-3: 메인 서버의 전용 Ubuntu VM. Proxmox 호스트/쿠버 노드에 설치하지 않음.
# 이 inventory는 실행기 VM 안에서만 사용. 미확정 IP를 만들지 않고 로컬로 설치한다.
all:
  children:
    recovery_runner:
      hosts:
        ansible_runner:
          ansible_connection: local
          physical_host: server
          planned_vcpu: 2
          planned_memory_mb: 2048
          planned_disk_gb: 20
