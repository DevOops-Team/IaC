- name: Register only this worker credential in manager MultiKueue
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
  - manager-preflight
  tasks:
  - name: Prepare kueue-system namespace (Kueue may be installed later by GitOps)
    ansible.builtin.include_role:
      name: gitops-secrets
      tasks_from: namespace
    vars:
      seed_context: '{{ manager_context }}'
      seed_namespace: kueue-system
  - name: Seed one remote worker credential
    ansible.builtin.include_role:
      name: gitops-secrets
      tasks_from: remote
