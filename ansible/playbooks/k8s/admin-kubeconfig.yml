---
# Kubespray only writes admin.conf to root's ~/.kube/config (the become user).
# Give each control-plane deploy account (ansible_user, already a sudoer) the
# same kubeconfig so kubectl works on master1~3 without sudo. Workers get none.
- name: Let the control-plane deploy account run kubectl without sudo
  hosts: kube_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Read the deploy account's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Create ~/.kube for the deploy account
      ansible.builtin.file:
        path: "{{ getent_passwd[ansible_user][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ getent_passwd[ansible_user][2] }}"
        mode: '0700'

    - name: Copy admin.conf to the deploy account's kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ getent_passwd[ansible_user][4] }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ getent_passwd[ansible_user][2] }}"
        mode: '0600'

    - name: Check kubectl works as the deploy account without sudo
      ansible.builtin.command:
        argv: [/usr/local/bin/kubectl, get, nodes, --no-headers]
      become: false
      changed_when: false
      register: admin_kubeconfig_nodes

    - name: Require all six nodes to be visible
      ansible.builtin.assert:
        that:
          - admin_kubeconfig_nodes.stdout_lines | length == groups['k8s_cluster'] | length
