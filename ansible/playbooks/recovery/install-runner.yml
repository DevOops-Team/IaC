---
- name: Reject superseded always-on recovery runner installation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
  - name: Follow adopted ADR-11 personal-PC manual execution
    ansible.builtin.fail:
      msg: >-
        ADR-11 supersedes the dedicated VM and systemd recovery timer.
        No runner is installed. Run scripts/recovery/watcher.py manually
        from your personal PC; see ansible/RECOVERY.md.
