---
- name: Require explicit VM configuration and Ubuntu
  ansible.builtin.assert:
    that:
      - vault_configure_confirmed | bool
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
      - vault_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - ansible_facts.swaptotal_mb | int == 0
      - vault_node_id is match('^[a-zA-Z0-9_-]+$')
      - vault_bind_address == ansible_host
    fail_msg: >-
      전용 Ubuntu VM을 확인하고 vault_configure_confirmed=true를 지정하세요.
      Raft 사용을 위해 swap을 별도로 끄고 기존 데이터/설정을 먼저 확인하세요.
- name: Read existing services
  ansible.builtin.service_facts:
- name: Remember whether Vault was already running
  ansible.builtin.set_fact:
    vault_was_running: "{{ ansible_facts.services.get('vault.service', {}).get('state', '') == 'running' }}"
- name: Read existing Vault configuration
  ansible.builtin.stat:
    path: '{{ vault_config_file }}'
    checksum_algorithm: sha256
  register: vault_existing_config
- name: Refuse unapproved configuration change on a running Vault
  ansible.builtin.assert:
    that:
      - >-
        not (vault_was_running | bool) or
        (vault_restart_confirmed | bool) or
        (vault_existing_config.stat.checksum | default('')) ==
        (lookup('ansible.builtin.template', 'vault.hcl.j2') | hash('sha256'))
    fail_msg: >-
      실행 중 Vault의 설정이 템플릿과 다릅니다. 먼저 Raft snapshot을 외부에 보관하고
      중단 시간과 수동 unseal을 준비한 뒤 vault_restart_confirmed=true를 지정하세요.
- name: Read existing service override
  ansible.builtin.stat:
    path: /etc/systemd/system/vault.service.d/10-devoops.conf
    checksum_algorithm: sha256
  register: vault_existing_override
- name: Refuse unapproved service override change before writing it
  ansible.builtin.assert:
    that:
      - >-
        not (vault_was_running | bool) or
        (vault_restart_confirmed | bool) or
        (vault_existing_override.stat.checksum | default('')) ==
        (lookup('ansible.builtin.template', 'service-override.conf.j2') | hash('sha256'))
    fail_msg: 실행 중 Vault의 systemd 설정 변경에는 snapshot/unseal 준비와 vault_restart_confirmed=true가 필요합니다.
- name: Check installed package version without exposing credentials
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}', vault]
    expand_argument_vars: false
  register: vault_existing_package
  changed_when: false
  failed_when: vault_existing_package.rc not in [0, 1]
  check_mode: false
- name: Do not implicitly upgrade or downgrade an existing Vault
  ansible.builtin.assert:
    that:
      - vault_existing_package.rc != 0 or vault_existing_package.stdout == vault_deb_version
    fail_msg: 기존 Vault 버전이 다릅니다. 업그레이드는 별도 검토하며 이 플레이북은 자동 변경하지 않습니다.
