- name: Require verified direct HTTPS path and DNS credentials
  ansible.builtin.assert:
    that:
    - acme_environment == 'production'
    - edge_dns_confirmed | bool
    - edge_public_ip | default('') | length > 0
    - cloudflare_zone_id | length > 0
    - lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') | length > 0
    fail_msg: Verify public IP to pfSense to Traefik HTTPS before confirming DNS cutover.
  no_log: true
  diff: false
- name: Confirm frontend certificate is ready
  ansible.builtin.command:
    argv:
    - kubectl
    - --context
    - '{{ manager_context }}'
    - -n
    - '{{ frontend_namespace }}'
    - wait
    - --for=condition=Ready
    - certificate/frontend-tls
    - --timeout=60s
  changed_when: false
- name: Verify frontend has ready endpoint addresses before public exposure
  ansible.builtin.command:
    argv:
    - kubectl
    - --context
    - '{{ manager_context }}'
    - -n
    - '{{ frontend_namespace }}'
    - get
    - endpointslices
    - -l
    - kubernetes.io/service-name={{ frontend_service_name }}
    - -o
    - json
  register: frontend_endpoints
  changed_when: false
- name: Require at least one ready frontend endpoint
  ansible.builtin.assert:
    that: (frontend_endpoints.stdout | from_json)['items'] | map(attribute='endpoints') | flatten | selectattr('conditions.ready',
      'defined') | selectattr('conditions.ready', 'equalto', true) | list | length > 0
- name: Configure DNS without Tunnel credentials
  no_log: true
  diff: false
  block:
  - name: Read records for the exact public hostname
    ansible.builtin.uri:
      url: '{{ cf_api }}/zones/{{ cloudflare_zone_id }}/dns_records?name={{ edge_domain | urlencode }}&per_page=100'
      headers: '{{ cf_headers }}'
    register: cf_dns
  - name: Validate DNS response and reject incomplete record listings
    ansible.builtin.assert:
      that:
      - cf_dns.json.success
      - cf_dns.json.result_info.total_pages | default(1) | int <= 1
  - name: Plan DNS-only record and require explicit existing-record replacement
    ansible.builtin.command:
      argv:
      - '{{ ansible_playbook_python }}'
      - '{{ role_path }}/files/plan_dns.py'
      stdin: '{{ {"ip": edge_public_ip, "name": edge_domain, "ttl": cloudflare_dns_ttl, "records": cf_dns.json.result, "replace_id": edge_dns_replace_record_id, "previous_content": edge_dns_previous_content} | to_json }}'
    register: cf_dns_plan
    changed_when: false
    check_mode: false
  - name: Decode record plan
    ansible.builtin.set_fact:
      cf_record_plan: '{{ cf_dns_plan.stdout | from_json }}'
  - name: Apply DNS-only public IP record
    ansible.builtin.uri:
      url: '{{ cf_api }}/zones/{{ cloudflare_zone_id }}/dns_records{{ cf_record_plan.suffix }}'
      method: '{{ cf_record_plan.method }}'
      headers: '{{ cf_headers }}'
      body_format: json
      body: '{{ cf_record_plan.body }}'
      status_code: [200, 201]
    register: cf_dns_write
    when:
    - cf_record_plan.method != 'NONE'
    - not ansible_check_mode
    changed_when: true
  - name: Validate DNS write result
    ansible.builtin.assert:
      that: cf_dns_write.json.success
    when:
    - cf_record_plan.method != 'NONE'
    - not ansible_check_mode
