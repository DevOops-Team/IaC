- name: Protect Secrets already handed to VSO
  ansible.builtin.import_tasks: vso-guard.yml
- name: Prepare local bootstrap namespaces
  ansible.builtin.include_tasks: namespace.yml
  loop:
  - platform
  - data-system
  - cert-manager
  loop_control:
    loop_var: seed_namespace
  vars:
    seed_context: '{{ manager_context }}'
# platform: frontend · backend · dispatcher, data-system: job-watcher (GPU-145) · 수집기
- name: Seed manager image pull Secret
  ansible.builtin.include_tasks: registry.yml
  loop:
  - platform
  - data-system
  loop_control:
    loop_var: seed_namespace
  vars:
    seed_context: '{{ manager_context }}'
- name: Require DNS-01 credential only for a Secret still managed by bootstrap
  ansible.builtin.assert:
    that:
      - lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') | length > 0
  no_log: true
  when: "'cert-manager/cloudflare-dns-api-token' not in seed_vso_protected_secrets"
- name: Seed DNS-01 API token via stdin
  ansible.builtin.command:
    argv:
    - kubectl
    - --context
    - '{{ manager_context }}'
    - apply
    - -f
    - '-'
    stdin: '{{ {"apiVersion":"v1","kind":"Secret","metadata":{"name":"cloudflare-dns-api-token","namespace":"cert-manager"},"type":"Opaque","stringData":{"api-token":lookup("env","CLOUDFLARE_DNS_API_TOKEN")}}
      | to_json }}'
  no_log: true
  diff: false
  when: "'cert-manager/cloudflare-dns-api-token' not in seed_vso_protected_secrets"
