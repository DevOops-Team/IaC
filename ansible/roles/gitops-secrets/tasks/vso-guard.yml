---
# VSO create:false는 ownerReferences를 만들지 않을 수 있다. 실제 동기화 CR과 명시적 인계 목록을 함께 본다.
- name: Discover VSO CRD without treating permission or network errors as absence
  ansible.builtin.command:
    argv: [kubectl, --context, '{{ manager_context }}', get, customresourcedefinitions, -o, json]
  register: seed_crds
  changed_when: false
  check_mode: false
- name: Start with explicitly handed-off Secret names
  ansible.builtin.set_fact:
    seed_vso_protected_secrets: '{{ gitops_vso_managed_secrets | default([]) }}'
- name: Read VSO synchronization targets without reading secret values
  ansible.builtin.command:
    argv: [kubectl, --context, '{{ manager_context }}', get, vaultstaticsecrets.secrets.hashicorp.com, --all-namespaces, -o, json]
  register: seed_vso_targets
  changed_when: false
  check_mode: false
  when: "'vaultstaticsecrets.secrets.hashicorp.com' in ((seed_crds.stdout | from_json)['items'] | map(attribute='metadata.name') | list)"
- name: Protect every declared VSO destination even when synchronization is unhealthy
  ansible.builtin.set_fact:
    seed_vso_protected_secrets: >-
      {{ (seed_vso_protected_secrets + [item.metadata.namespace ~ '/' ~ item.spec.destination.name]) | unique | list }}
  loop: >-
    {{ ((seed_vso_targets.stdout | default('{"items": []}')) | from_json)['items'] }}
  loop_control:
    label: '{{ item.metadata.namespace }}/{{ item.spec.destination.name }}'
- name: Validate explicit handoff names
  ansible.builtin.assert:
    that:
      - item is match('^[a-z0-9][a-z0-9.-]*/[a-z0-9][a-z0-9.-]*$')
  loop: '{{ seed_vso_protected_secrets }}'
- name: Require already available Secrets before skipping bootstrap writes
  ansible.builtin.command:
    argv: [kubectl, --context, '{{ manager_context }}', -n, '{{ item.split("/")[0] }}', get, secret, '{{ item.split("/")[1] }}', -o, name]
  loop: '{{ seed_vso_protected_secrets }}'
  changed_when: false
  check_mode: false
