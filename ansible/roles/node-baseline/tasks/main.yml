---
- name: Install baseline operational tools on Kubernetes VMs
  ansible.builtin.apt:
    name:
    - ca-certificates
    - curl
    - chrony
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Enable clock synchronization needed by etcd and TLS
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started
