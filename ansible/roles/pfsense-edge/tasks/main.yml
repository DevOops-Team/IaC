- name: Validate requested pfSense operations
  ansible.builtin.assert:
    that:
    - pfsense_edge_confirmed | bool
    - (pfsense_edge_https_enabled | bool) or (pfsense_edge_ipsec_enabled | bool)
    - not (pfsense_edge_https_enabled | bool) or ansible_play_hosts_all | length == 1
    - pfsense_edge_ipsec_state in ['present', 'absent']
    fail_msg: Confirm the target firewall and configuration backup. HTTPS NAT must target only the primary firewall.

- name: Require root access for pfSense configuration modules
  ansible.builtin.raw: id -u
  register: pfsense_edge_uid
  changed_when: false
  check_mode: false

- name: Validate privileged connection
  ansible.builtin.assert:
    that: pfsense_edge_uid.stdout | trim == '0'

- name: Keep a private local backup on the firewall before changing configuration
  ansible.builtin.copy:
    src: /cf/conf/config.xml
    dest: '/cf/conf/config.xml.gpu-edge-{{ now(utc=True, fmt="%Y%m%dT%H%M%S%fZ") }}'
    remote_src: true
    mode: '0600'
    force: false
  when: not ansible_check_mode
  no_log: true

- name: Configure public HTTPS forwarding
  ansible.builtin.include_tasks: https.yml
  when: pfsense_edge_https_enabled | bool

- name: Configure EKS IPsec inbound services
  ansible.builtin.include_tasks: ipsec.yml
  when: pfsense_edge_ipsec_enabled | bool
