# prod 환경 설정 (GPU-171). live/base · live/eks가 이 파일을 읽어 모듈에 넣는다.
# 계정 ID는 여기 없다: 실행할 때 aws sts로 읽고, 이름은 <project>-<env>-<용도>-<account>-<region>으로 만든다.
# 공인 IP처럼 레포에 두면 안 되는 값은 live/<root>/terraform.local.tfvars(Git 제외)에 둔다.

project: devoops
environment: prod
region: us-east-2

# ---------------------------------------------------------------- base: 영속 데이터
storage:
  # 학습 코드 · 데이터셋 · 체크포인트(jobs/) · DB 백업(backups/db/). 이름: <prefix>-ckpt-<account>-<region>
  checkpoint:
    suffix: ckpt
    versioning: true
    bucket_owner_enforced: true
    lifecycle_rules:
      - id: database-backups-30-days            # GPU-128 / ADR-31
        prefix: backups/db/
        expiration_days: 30
        noncurrent_expiration_days: 30
      - id: database-backups-expired-delete-markers
        prefix: backups/db/
        expired_object_delete_marker: true
      # 브라우저 직접 업로드(GPU-278)의 끝나지 않은 multipart 조각: 목록에 안 보이고 요금은 나간다.
      # 업로드 URL은 1시간이면 만료되므로 하루 지난 미완료 업로드는 버린다
      - id: abort-incomplete-dataset-uploads
        prefix: datasets/
        abort_incomplete_multipart_days: 1
    # 학습 제출 업로드: 브라우저가 Backend presigned URL로 datasets/<id>/v1/에 직접 PUT (GPU-278).
    # Cloudflare 프록시 요청 제한(100MB)을 피한다. 객체 접근 권한은 서명(Backend 역할)이 정하고 CORS는 출처만 연다.
    # x-amz-checksum-sha256: 서명에 넣은 sha256으로 S3가 내용을 검증. localhost는 Frontend 로컬 개발(vite)
    cors_rules:
      - id: submission-upload
        allowed_origins: ["https://devoops.site", "http://localhost:5173"]
        allowed_methods: ["PUT"]
        allowed_headers: ["content-type", "x-amz-checksum-sha256"]
        expose_headers: ["ETag"]
        max_age_seconds: 3600
  # Mimir · Loki · Tempo 장기 저장. 보존은 각 앱이 관리한다 (일괄 만료 규칙 넣지 않음)
  monitoring:
    suffix: monitoring
    versioning: false
    bucket_owner_enforced: false
    lifecycle_rules:
      - id: abort-incomplete-multipart-uploads
        abort_incomplete_multipart_days: 1

# 체크포인트 세대 · 승인 · 하트비트 (ADR-6). 이름: <prefix>-fencing
fencing_table:
  hash_key: job_id
  pitr_days: 35

# 복구 사건 · 진행 상태 · 증거. 이름: <prefix>-recovery
recovery_table:
  hash_key: pk
  pitr_days: 35

# ---------------------------------------------------------------- base: 온프레 → AWS 인증
# 워크로드 목록. 인증서 CN = <prefix>-<이름> (bootstrap/certs.sh). 권한은 live/base/onprem-roles.tf
onprem_workloads: [backend, recovery, relocator, multikueue, db-backup, mimir, loki, tempo]

# ---------------------------------------------------------------- base: 네트워크
network:
  enabled: false           # false로 apply하면 VPC · NAT · VPN을 지운다 (EKS를 먼저 지울 것). NAT+VPN은 시간당 과금
  cidr: 172.28.0.0/16
  subnets:                 # AZ => 서브넷. NAT는 정렬한 첫 AZ, EKS 클러스터는 az_index로 AZ를 고른다
    us-east-2a: { public_cidr: 172.28.10.0/24, private_cidr: 172.28.64.0/20 }
    us-east-2b: { public_cidr: 172.28.20.0/24, private_cidr: 172.28.80.0/20 }
    us-east-2c: { public_cidr: 172.28.30.0/24, private_cidr: 172.28.96.0/20 }
  vpn:                     # customer_gateway_ip(온프레 공인 IP)는 live/base/terraform.local.tfvars
    customer_gateway_asn: 65010   # pfSense BGP
    amazon_side_asn: 64512

# ---------------------------------------------------------------- eks
eks:
  kubernetes_version: "1.35"
  topology: test           # test | full. run.sh --topology로 덮어쓴다
  onprem_cidr: 172.30.0.0/24   # EKS API에 붙는 온프레 대역 (VPN 경유)
  cpu:                     # 클러스터마다 시스템 CPU 노드 1대 (On-Demand)
    instance_type: t3.large
    disk_size: 30
  clusters:                # 이름 eks-<키>. az_index: network.subnets를 정렬한 순서
    a: { service_cidr: 10.100.0.0/16, az_index: 0 }
    b: { service_cidr: 10.101.0.0/16, az_index: 1 }
    c: { service_cidr: 10.102.0.0/16, az_index: 2 }
  topologies:              # GPU는 모두 Spot, 최소 = 희망 = 최대로 고정 (ADR-25, Karpenter 없음)
    test:                  # A/B 각각 학습 4 + 예비 1, g4dn.xlarge 총 10대 = 40 vCPU
      clusters: [a, b]
      gpu_instance_types: [g4dn.xlarge]
      gpu: { a: { training: 4, spare: 1 }, b: { training: 4, spare: 1 } }
    full:                  # 15대. 쿼터 확인 뒤에만
      clusters: [a, b, c]
      gpu_instance_types: [g4dn.xlarge, g4dn.2xlarge]
      gpu: { a: { training: 4, spare: 1 }, b: { training: 4, spare: 1 }, c: { training: 4, spare: 1 } }
