name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pfsense-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate firewall policy scripts without firewall access
        run: |
          php -l scripts/pfsense/vpn-inbound.php
          php -l scripts/pfsense/tests/test-vpn-inbound.php
          php scripts/pfsense/tests/test-vpn-inbound.php

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/state
          - terraform/data
          - terraform/identity
          - terraform/vpc
          - terraform/eks
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - name: init (backend 없이)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - name: validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
      - name: Managed GPU topology (mock AWS, no resources created)
        if: matrix.dir == 'terraform/eks'
        run: terraform test
        working-directory: ${{ matrix.dir }}

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax (terraform/run.sh · bootstrap/certs.sh)
        run: bash -n terraform/run.sh && bash -n bootstrap/certs.sh
      - name: certs.sh issues CN-matching 60-day certificates (temporary PKI)
        run: |
          pki="$RUNNER_TEMP/pki"
          bootstrap/certs.sh --pki-dir "$pki" --init-ca
          for w in backend mimir loki tempo; do
            openssl x509 -in "$pki/$w/client.pem" -noout -subject | grep -q "CN *= *devoops-prod-$w"
            openssl x509 -in "$pki/$w/client.pem" -noout -checkend $((59*86400))
            ! openssl x509 -in "$pki/$w/client.pem" -noout -checkend $((61*86400))
          done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: run.sh validate (no backend, no credentials)
        run: terraform/run.sh validate

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pyyaml
      - name: cloudflare DNS plan
        run: python -m unittest tests/test_cloudflare_dns.py
      - name: recovery watcher
        run: python -m unittest discover -s tests
        working-directory: ansible/scripts/recovery
