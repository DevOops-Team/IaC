name: ci

on:
  pull_request:
  push:
    branches: [main]   # develop 커밋은 PR에서 점검 — push까지 걸면 같은 커밋이 두 번 돈다 (GPU-214)

permissions:
  contents: read

env:
  # provider(aws 약 700MB)를 job마다 받지 않도록 공유 캐시 + actions/cache (lock 파일이 바뀌면 새로 받음)
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  vault-ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible-core==2.20.0
      - name: Vault VM · VSO bootstrap · Secret 인계 문법 검사 (외부 접속 없음)
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/vault/hosts.yaml playbooks/vault/configure-vms.yml --syntax-check
          ansible-playbook -i inventory/onprem/hosts.yaml playbooks/bootstrap/install-vso.yml --syntax-check
          ansible-playbook -i inventory/onprem/hosts.yaml playbooks/bootstrap/seed-secrets.yml --syntax-check
      - name: 실제 role로 VSO Secret 덮어쓰기 방지 시험 (모의 kubectl)
        run: python -m unittest discover -s ansible/tests -v

  pfsense-ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible-core==2.20.0
      - run: ansible-galaxy collection install -r requirements-pfsense.yml
        working-directory: ansible
      - name: pfSense 플레이북 문법 검사 (방화벽 접속 없음)
        working-directory: ansible
        run: |
          ansible-playbook -i localhost, playbooks/network/configure-pfsense-edge.yml --syntax-check
          ansible-playbook -i localhost, playbooks/network/configure-pfsense-edge.yml -e @pfsense-ipsec.example.yml --syntax-check

  pfsense-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: pfSense 정책 스크립트 검사 (방화벽 접속 없이)
        run: |
          php -l scripts/pfsense/vpn-inbound.php
          php -l scripts/pfsense/tests/test-vpn-inbound.php
          php scripts/pfsense/tests/test-vpn-inbound.php

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/state
          - terraform/live/base
          - terraform/live/eks
          - terraform/live/cost
    steps:
      - uses: actions/checkout@v4
      - name: provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - name: init (backend 없이)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - name: validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
      - name: GPU 토폴로지 테스트 (mock AWS, 자원 생성 없음)
        if: matrix.dir == 'terraform/live/eks'
        run: terraform test
        working-directory: ${{ matrix.dir }}

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax (terraform/run.sh · bootstrap/certs.sh)
        run: bash -n terraform/run.sh && bash -n bootstrap/certs.sh
      - name: certs.sh issues CN-matching 60-day certificates (temporary PKI)
        run: |
          pki="$RUNNER_TEMP/pki"
          bootstrap/certs.sh --pki-dir "$pki" --init-ca
          for w in backend mimir loki tempo; do
            openssl x509 -in "$pki/$w/client.pem" -noout -subject | grep -q "CN *= *devoops-prod-$w"
            openssl x509 -in "$pki/$w/client.pem" -noout -checkend $((59*86400))
            ! openssl x509 -in "$pki/$w/client.pem" -noout -checkend $((61*86400))
          done
      - name: provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: terraform fmt (roots · modules · config 포함 전체)
        run: terraform fmt -check -recursive terraform
      - name: run.sh validate (no backend, no credentials)
        run: terraform/run.sh validate

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 테스트 의존성 설치
        run: pip install pyyaml boto3
      - name: AWS 비용 집계 (외부 호출 없음)
        run: python -m unittest discover -s scripts/cost/tests -v
      - name: Cloudflare DNS 계획 테스트
        run: python -m unittest discover -s tests -v
        working-directory: ansible/roles/cloudflare-provider
      - name: recovery watcher
        run: python -m unittest discover -s tests
        working-directory: ansible/scripts/recovery
